[package]
name = "everything-etf"
version = "0.1.0"
description = "Tote: launchpad for equal-weight on-chain basket tokens"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "everything_etf"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# init-if-needed is enabled for one account: the per-wallet Profile PDA in
# set_profile. It is seeded by the signer and holds only a name that same
# signer may overwrite, so there is nothing to drain and no state an attacker
# could usefully reset. Do not reach for it elsewhere without that being true.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["metadata"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
